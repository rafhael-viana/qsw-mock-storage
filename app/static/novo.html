<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque - Novo produto</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Estoque</h1>
    <nav>
      <a href="/ui/" data-testid="nav-produtos">Produtos</a>
      <a href="/ui/novo.html" data-testid="nav-novo">Novo produto</a>
      <a href="/ui/movimentar.html" data-testid="nav-movimentar">Movimentar estoque</a>
    </nav>
  </aside>

  <main>
    <h2>Novo produto</h2>
    <div class="mensagem" data-testid="mensagem" hidden></div>

    <form data-testid="form-produto" novalidate>
      <label>Nome
        <input name="nome" data-testid="campo-nome" maxlength="120">
      </label>
      <label>Descrição
        <textarea name="descricao" data-testid="campo-descricao" maxlength="500" rows="3"></textarea>
      </label>
      <label>Preço (R$)
        <input name="preco" data-testid="campo-preco" type="number" step="0.01">
      </label>
      <label>Quantidade inicial
        <input name="quantidade" data-testid="campo-quantidade" type="number" step="1" value="0">
      </label>
      <div>
        <button type="submit" data-testid="botao-salvar">Salvar</button>
        <a href="/ui/" class="botao secundario">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="/ui/app.js"></script>
  <script>
    // A validação fica a cargo da API (novalidate no form), para os erros
    // de dados inválidos aparecerem na tela e poderem ser testados no E2E.
    document.querySelector("[data-testid='form-produto']").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const form = evento.target;
      const dados = {
        nome: form.nome.value.trim(),
        descricao: form.descricao.value.trim() || null,
        preco: form.preco.value === "" ? null : form.preco.value,
        quantidade: form.quantidade.value === "" ? 0 : Number(form.quantidade.value),
      };

      try {
        const produto = await api("/produtos", { method: "POST", body: JSON.stringify(dados) });
        const msg = `Produto "${produto.nome}" cadastrado com sucesso.`;
        window.location.href = `/ui/?msg=${encodeURIComponent(msg)}`;
      } catch (e) {
        mostrarMensagem(`Não foi possível cadastrar: ${e.message}`, "erro");
      }
    });
  </script>
</body>
</html>
